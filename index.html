<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ITツール50選 — カテゴリ別ディレクトリ</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Nunito:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f6fb;--bg2:#fff;--bg3:#eef1f8;--border:rgba(60,80,160,.1);--border2:rgba(60,80,160,.2);
  --text:#1a1d2e;--text2:#545878;--text3:#9298b0;--accent:#4361ee;--accent2:#7c3aed;
  --radius:14px;--sh:0 2px 12px rgba(60,80,160,.07);--sh-lg:0 8px 32px rgba(60,80,160,.13)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Noto Sans JP",sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
header{position:sticky;top:0;z-index:100;background:rgba(244,246,251,.94);backdrop-filter:blur(14px);
  border-bottom:1px solid var(--border);padding:0 20px;height:60px;display:flex;align-items:center;gap:12px}
.h-logo{display:flex;align-items:center;gap:9px;text-decoration:none;flex-shrink:0}
.h-logo-icon{width:32px;height:32px;background:linear-gradient(135deg,var(--accent),var(--accent2));
  border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:16px}
.h-logo-name{font-family:"Nunito",sans-serif;font-size:17px;font-weight:900;color:var(--text);letter-spacing:-.3px}
.h-search{flex:1;max-width:320px;position:relative}
.h-search input{width:100%;background:var(--bg3);border:1.5px solid var(--border);border-radius:9px;
  padding:7px 12px 7px 34px;font-size:13px;color:var(--text);font-family:"Noto Sans JP",sans-serif;outline:none;transition:all .2s}
.h-search input:focus{border-color:var(--accent);background:#fff;box-shadow:0 0 0 3px rgba(67,97,238,.1)}
.h-search input::placeholder{color:var(--text3)}
.h-si{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--text3);font-size:13px;pointer-events:none}
.h-count{font-size:12px;color:var(--text3);white-space:nowrap;margin-left:auto}
.hero{padding:32px 20px 20px;max-width:1200px;margin:0 auto}
.hero-tag{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;
  letter-spacing:.08em;color:var(--accent);background:#eef2ff;padding:5px 12px;border-radius:20px;margin-bottom:10px}
.hero h1{font-family:"Nunito",sans-serif;font-size:clamp(20px,4vw,34px);font-weight:900;
  line-height:1.2;letter-spacing:-.5px;margin-bottom:8px}
.hero h1 em{font-style:normal;background:linear-gradient(135deg,var(--accent),var(--accent2));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.hero-sub{font-size:13px;color:var(--text2);line-height:1.8}
.filters{max-width:1200px;margin:0 auto;padding:0 20px 20px}
.filter-label{font-size:10px;font-weight:700;letter-spacing:.1em;color:var(--text3);text-transform:uppercase;margin-bottom:7px}
.pills{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.pill{padding:5px 12px;border-radius:20px;font-size:11.5px;font-weight:600;cursor:pointer;
  border:1.5px solid var(--border2);background:var(--bg2);color:var(--text2);transition:all .15s;font-family:"Noto Sans JP",sans-serif}
.pill:hover{border-color:var(--accent);color:var(--accent);background:#eef2ff}
.pill.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.pill.active-prob{background:var(--accent2);color:#fff;border-color:var(--accent2)}
.main{max-width:1200px;margin:0 auto;padding:0 20px 80px}
.res-bar{display:flex;align-items:center;margin-bottom:14px}
.res-c{font-size:12px;color:var(--text3)}
.res-c strong{color:var(--text)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.card{background:var(--bg2);border:1.5px solid var(--border);border-radius:var(--radius);
  cursor:pointer;transition:all .22s;display:flex;flex-direction:column;padding:0;gap:0;
  overflow:hidden;animation:fadeUp .2s ease both}
.card:hover{transform:translateY(-4px);box-shadow:var(--sh-lg);border-color:var(--border2)}
.card-img-wrap{position:relative;height:158px;overflow:hidden;flex-shrink:0;background-color:#fdfbf7;background-image:radial-gradient(rgba(0,0,0,0.015) 1px,transparent 0),radial-gradient(rgba(0,0,0,0.01) 2px,transparent 0),linear-gradient(to right,rgba(180,160,120,0.015) 1px,transparent 1px),linear-gradient(to bottom,rgba(180,160,120,0.015) 1px,transparent 1px);background-size:12px 12px,24px 24px,6px 6px,6px 6px;border-bottom:1px solid rgba(60,80,160,0.05)}
.card-img{width:100%;height:100%;object-fit:cover;transition:transform .3s ease}
.card:hover .card-img{transform:scale(1.05)}
.card-illust{width:100%;height:100%;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;mix-blend-mode:multiply}
.card-illust::before{content:'';position:absolute;width:125px;height:105px;top:15%;left:20%;border-radius:38% 62% 63% 37% / 41% 44% 56% 59%;background:var(--theme-color-1,rgba(67,97,238,0.25));filter:blur(10px);transform:rotate(-10deg);animation:watercolor-float-1 8s ease-in-out infinite alternate}
.card-illust::after{content:'';position:absolute;width:105px;height:115px;bottom:10%;right:15%;border-radius:64% 36% 47% 53% / 49% 58% 42% 51%;background:var(--theme-color-2,rgba(124,58,237,0.2));filter:blur(12px);transform:rotate(15deg);animation:watercolor-float-2 10s ease-in-out infinite alternate}
.card-illust-splash{position:absolute;width:50px;height:50px;top:45%;left:45%;border-radius:50% 40% 60% 30% / 40% 50% 30% 60%;background:var(--theme-color-3,rgba(67,97,238,0.15));filter:blur(7px);transform:translate(-30px,20px) rotate(45deg);animation:watercolor-float-3 12s ease-in-out infinite alternate}
.card-illust-icon{font-size:56px;position:relative;z-index:2;filter:drop-shadow(0 4px 10px rgba(0,0,0,0.12)) saturate(0.85) contrast(0.9);transition:transform 0.4s cubic-bezier(0.175,0.885,0.32,1.275)}
.card:hover .card-illust-icon{transform:scale(1.15) rotate(4deg)}
@keyframes watercolor-float-1{0%{border-radius:38% 62% 63% 37% / 41% 44% 56% 59%;transform:rotate(-10deg) translate(0,0)}100%{border-radius:45% 55% 50% 50% / 50% 48% 52% 50%;transform:rotate(5deg) translate(-5px,8px)}}
@keyframes watercolor-float-2{0%{border-radius:64% 36% 47% 53% / 49% 58% 42% 51%;transform:rotate(15deg) translate(0,0)}100%{border-radius:50% 50% 60% 40% / 60% 45% 55% 40%;transform:rotate(-10deg) translate(8px,-5px)}}
@keyframes watercolor-float-3{0%{border-radius:50% 40% 60% 30% / 40% 50% 30% 60%;transform:translate(-30px,20px) rotate(45deg) scale(0.9)}100%{border-radius:40% 60% 30% 70% / 50% 30% 70% 50%;transform:translate(-25px,15px) rotate(60deg) scale(1.1)}}
.card-cat-badge{position:absolute;top:10px;left:10px;background:rgba(10,12,24,.55);color:#fff;
  font-size:10px;font-weight:700;padding:3px 9px;border-radius:20px;letter-spacing:.04em;
  backdrop-filter:blur(6px)}
.card-body{padding:14px 14px 12px;display:flex;flex-direction:column;gap:8px;flex:1}
.card-name{font-size:13.5px;font-weight:700;color:var(--text);margin-bottom:2px}
.card-tagline{font-size:11px;color:var(--text3);line-height:1.4}
.card-desc{font-size:11.5px;color:var(--text2);line-height:1.6}
.card-tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:auto}
.tag{font-size:10px;padding:3px 8px;border-radius:6px;font-weight:600}
.tag-cat{background:#eef2ff;color:var(--accent)}
.tag-prob{background:var(--bg3);color:var(--text2);border:1px solid var(--border)}
.card-footer{display:flex;align-items:center;justify-content:flex-end;padding-top:8px;border-top:1px solid var(--border);margin-top:6px}
.card-detail-link{font-size:11px;font-weight:700;color:var(--accent);display:flex;align-items:center;gap:3px;opacity:.65;transition:opacity .15s}
.card:hover .card-detail-link{opacity:1}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.empty{text-align:center;padding:60px 20px;color:var(--text3);font-size:14px;grid-column:1/-1}
.modal-bg{display:none;position:fixed;inset:0;z-index:300;background:rgba(26,29,46,.5);
  backdrop-filter:blur(4px);align-items:flex-start;justify-content:center;padding:24px 16px;overflow-y:auto}
.modal-bg.open{display:flex}
.modal{background:var(--bg2);border-radius:20px;width:100%;max-width:580px;overflow:hidden;
  box-shadow:0 24px 64px rgba(0,0,0,.2);animation:fadeUp .2s ease both;margin:auto}
.modal-header{padding:22px 22px 0;display:flex;align-items:flex-start;gap:13px}
.modal-icon{width:52px;height:52px;border-radius:14px;display:flex;align-items:center;
  justify-content:center;font-size:26px;flex-shrink:0}
.modal-title{flex:1}
.modal-title h2{font-family:"Nunito",sans-serif;font-size:21px;font-weight:900;letter-spacing:-.3px;margin-bottom:2px}
.modal-title p{font-size:12px;color:var(--text3)}
.modal-close{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--border);background:transparent;
  cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--text3);flex-shrink:0}
.modal-close:hover{background:var(--bg3);color:var(--text)}
.modal-body{padding:18px 22px 22px}
.modal-tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.modal-tags .tag{font-size:11.5px;padding:4px 10px}
.section-label{font-size:10px;font-weight:700;letter-spacing:.08em;color:var(--text3);
  text-transform:uppercase;margin-bottom:7px;margin-top:14px}
.feature-list{display:flex;flex-direction:column;gap:6px}
.fi{display:flex;align-items:flex-start;gap:8px;font-size:13px;color:var(--text2);line-height:1.6}
.fi-dot{color:var(--accent);font-size:8px;margin-top:5px;flex-shrink:0}
.usecase-box{background:#f0fdf4;border:1.5px solid #bbf7d0;border-left:4px solid #22c55e;
  border-radius:var(--radius);padding:13px 15px;font-size:13px;color:var(--text2);line-height:1.7;margin-top:7px}
.official-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;
  background:linear-gradient(135deg,var(--accent),var(--accent2));border:none;border-radius:10px;
  padding:12px;font-size:14px;font-weight:700;color:#fff;font-family:"Noto Sans JP",sans-serif;
  cursor:pointer;text-decoration:none;margin-top:18px;transition:all .2s}
.official-btn:hover{transform:translateY(-1px);box-shadow:0 6px 22px rgba(67,97,238,.4)}
.back-top{position:fixed;bottom:24px;right:24px;width:40px;height:40px;background:var(--accent);
  border:none;border-radius:50%;display:flex;align-items:center;justify-content:center;
  cursor:pointer;opacity:0;pointer-events:none;transition:all .2s;font-size:16px;color:#fff;
  box-shadow:0 4px 14px rgba(67,97,238,.4)}
.back-top.visible{opacity:1;pointer-events:all}
.h-menu-btn{width:36px;height:36px;border:none;background:transparent;cursor:pointer;font-size:20px;color:var(--text2);border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0;line-height:1}
.h-menu-btn:hover{background:var(--bg3);color:var(--text)}
.sidebar{position:fixed;top:0;left:0;height:100vh;width:240px;background:var(--bg2);border-right:1.5px solid var(--border);z-index:200;transform:translateX(-100%);transition:transform .3s ease;display:flex;flex-direction:column;box-shadow:4px 0 20px rgba(60,80,160,.1)}
.sidebar.open{transform:translateX(0)}
.sidebar-header{padding:16px 16px 12px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);flex-shrink:0}
.sidebar-title{font-family:"Nunito",sans-serif;font-size:15px;font-weight:900;color:var(--text);letter-spacing:-.2px}
.sidebar-close{width:28px;height:28px;border:none;background:transparent;cursor:pointer;font-size:14px;color:var(--text3);border-radius:6px;display:flex;align-items:center;justify-content:center}
.sidebar-close:hover{background:var(--bg3);color:var(--text)}
.sidebar-nav{padding:8px;display:flex;flex-direction:column;gap:2px;overflow-y:auto;flex:1}
.sidebar-item{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:8px;cursor:pointer;font-size:13px;color:var(--text2);border:none;background:transparent;width:100%;text-align:left;font-family:"Noto Sans JP",sans-serif;transition:all .15s}
.sidebar-item:hover{background:var(--bg3);color:var(--text)}
.sidebar-item.active{background:#eef2ff;color:var(--accent);font-weight:700}
.sidebar-item-icon{font-size:16px;width:22px;text-align:center;flex-shrink:0}
.sidebar-item-count{margin-left:auto;font-size:10px;color:var(--text3);background:var(--bg3);padding:2px 7px;border-radius:10px;flex-shrink:0}
.sidebar-item.active .sidebar-item-count{background:rgba(67,97,238,.12);color:var(--accent)}
.sidebar-overlay{display:none;position:fixed;inset:0;z-index:199;background:rgba(26,29,46,.4);backdrop-filter:blur(2px)}
.sidebar-overlay.open{display:block}
@media(max-width:960px){
  .h-search{max-width:240px}
}
@media(max-width:680px){
  header{height:auto;padding:8px 14px;flex-wrap:wrap;gap:8px}
  .h-logo-name{font-size:15px}
  .h-search{max-width:none;flex:1 1 160px;order:3;width:100%}
  .h-count{margin-left:0}
  .grid{grid-template-columns:1fr 1fr;gap:10px}
  .card-img-wrap{height:120px}
  .card-body{padding:18px 11px 11px}
  .card-name{font-size:12.5px}
  .card-tagline{font-size:10.5px}
  .card-desc{display:none}
  .hero{padding:20px 16px 14px}
  .main{padding:0 16px 60px}
}
@media(max-width:400px){
  .grid{grid-template-columns:1fr}
  .card-img-wrap{height:160px}
  .card-desc{display:block}
}
</style>
</head>

</div>

<div class="sidebar" id="sidebar">
  <div class="sidebar-header">

<div class="sidebar-overlay" id="sidebarOverlay"></div>

<div class="main">

</div>

<button class="back-top" id="backTop" onclick="window.scrollTo({top:0,behavior:'smooth'})">↑</button>

var activeCat='all';
var CATS=['all'].concat(Array.from(new Set(T.map(function(t){return t.cat}))));

function mk(tag,cls,txt){
  var e=document.createElement(tag);
  if(cls)e.className=cls;
  if(txt!==undefined)e.textContent=txt;
  return e;
}

function init(){
  document.getElementById('modalBg').addEventListener('click',function(e){
    if(e.target===this)closeModal();
  });
  document.getElementById('modalCloseBtn').addEventListener('click',closeModal);
  document.addEventListener('keydown',function(e){if(e.key==='Escape')closeModal();});
  window.addEventListener('scroll',function(){
    document.getElementById('backTop').classList.toggle('visible',window.scrollY>400);
  });
  initSidebar();
  render();
}


function getFiltered(){
  var q=document.getElementById('searchInput').value.toLowerCase().trim();
  return T.filter(function(t){
    if(activeCat!=='all'&&t.cat!==activeCat)return false;
    if(q){
      var hay=[t.name,t.tagline,t.desc,t.cat].concat(t.p).join(' ').toLowerCase();
      if(!hay.includes(q))return false;
    }
    return true;
  });
}


function render(){
  var r=getFiltered();
  var rc=document.getElementById('resCount');
  rc.textContent='';
  var s=mk('strong','',String(r.length));
  rc.appendChild(s);
  rc.appendChild(document.createTextNode(' / '+T.length+' ツール'));
  document.getElementById('countBadge').textContent=r.length+'ツール';

  var g=document.getElementById('grid');
  while(g.firstChild)g.removeChild(g.firstChild);

  if(!r.length){g.appendChild(mk('div','empty','条件に一致するツールが見つかりませんでした'));return;}

  r.forEach(function(t,i){
    var card=mk('div','card');
    card.style.animationDelay=Math.min(i*.025,.4)+'s';
    card.addEventListener('click',function(){window.location=t.id+'.html';});

    // Image header
    var imgWrap=mk('div','card-img-wrap');
    var img=mk('img','card-img');
    img.src='img/'+IMG_MAP[t.id];
    img.alt=t.name;
    imgWrap.appendChild(img);
    var catBadge=mk('div','card-cat-badge',t.cat);
    imgWrap.appendChild(catBadge);
    card.appendChild(imgWrap);

    // Card Body
    var body=mk('div','card-body');

    var info=mk('div');
    info.appendChild(mk('div','card-name',t.name));
    info.appendChild(mk('div','card-tagline',t.tagline));
    body.appendChild(info);

    var desc=mk('div','card-desc',t.desc);
    body.appendChild(desc);

    var tags=mk('div','card-tags');
    t.p.slice(0,3).forEach(function(p){tags.appendChild(mk('span','tag tag-prob',p));});
    body.appendChild(tags);

    var footer=mk('div','card-footer');
    var lnk=mk('span','card-detail-link');
    lnk.textContent='詳細を見る ';
    var arr=mk('span','arrow','→');
    lnk.appendChild(arr);
    footer.appendChild(lnk);
    body.appendChild(footer);

    card.appendChild(body);
    g.appendChild(card);
  });
}

function openModal(id){
  var t=T.find(function(x){return x.id===id;});
  if(!t)return;

  var mi=document.getElementById('mIcon');
  mi.style.background=t.c+'22';
  mi.style.fontSize='26px';
  mi.textContent=t.icon;
  document.getElementById('mName').textContent=t.name;
  document.getElementById('mTagline').textContent=t.tagline;

  var mt=document.getElementById('mTags');
  while(mt.firstChild)mt.removeChild(mt.firstChild);
  var ctag=mk('span','tag tag-cat',t.cat);
  ctag.style.cssText='font-size:12px;padding:4px 10px';
  mt.appendChild(ctag);
  t.p.forEach(function(p){
    var pt=mk('span','tag tag-prob',p);
    pt.style.cssText='font-size:12px;padding:4px 10px';
    mt.appendChild(pt);
  });

  var mf=document.getElementById('mFeatures');
  while(mf.firstChild)mf.removeChild(mf.firstChild);
  t.f.forEach(function(feat){
    var row=mk('div','fi');
    var dot=mk('span','fi-dot','✦');
    row.appendChild(dot);
    row.appendChild(document.createTextNode(feat));
    mf.appendChild(row);
  });

  document.getElementById('mUsecase').textContent=t.u;
  document.getElementById('mUrl').href=t.url;

  document.getElementById('modalBg').classList.add('open');
  document.body.style.overflow='hidden';
}

function closeModal(){
  document.getElementById('modalBg').classList.remove('open');
  document.body.style.overflow='';
}

var CAT_ICONS={'AI':'🤖','コミュニケーション':'💬','ビデオ会議':'📹','生産性スイート':'🌐','ドキュメント管理':'📁','プロジェクト管理':'📋','CRM・営業':'🤝','自動化・RPA':'⚡','ローコード・DB':'🗄','経理・HR':'💼','デザイン':'🎨','会議・録画':'🎬','スケジュール':'📅','決済':'💳'};

function initSidebar(){
  var sidebar=document.getElementById('sidebar');
  var overlay=document.getElementById('sidebarOverlay');
  document.getElementById('sidebarToggle').addEventListener('click',function(){
    sidebar.classList.toggle('open');
    overlay.classList.toggle('open');
  });
  document.getElementById('sidebarClose').addEventListener('click',closeSidebar);
  overlay.addEventListener('click',closeSidebar);

  var nav=document.getElementById('sidebarNav');
  var allItem=mk('button','sidebar-item active');
  var allIcon=mk('span','sidebar-item-icon','🧰');
  allItem.appendChild(allIcon);
  allItem.appendChild(mk('span','','すべて'));
  var allCount=mk('span','sidebar-item-count','50');
  allItem.appendChild(allCount);
  allItem.addEventListener('click',function(){activeCat='all';closeSidebar();render();syncSidebar();});
  nav.appendChild(allItem);

  CATS.slice(1).forEach(function(c){
    var count=T.filter(function(t){return t.cat===c;}).length;
    var item=mk('button','sidebar-item');
    var icon=mk('span','sidebar-item-icon',CAT_ICONS[c]||'📌');
    item.appendChild(icon);
    item.appendChild(mk('span','',c));
    var cnt=mk('span','sidebar-item-count',String(count));
    item.appendChild(cnt);
    item.addEventListener('click',function(){activeCat=c;closeSidebar();render();syncSidebar();});
    nav.appendChild(item);
  });
}

function closeSidebar(){
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebarOverlay').classList.remove('open');
}

function syncSidebar(){
  var items=document.querySelectorAll('.sidebar-item');
  var allCats=['all'].concat(CATS.slice(1));
  items.forEach(function(item,i){
    item.classList.toggle('active',allCats[i]===activeCat);
  });
}

document.addEventListener('DOMContentLoaded',init);
